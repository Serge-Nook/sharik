<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>Шарик — сканер IP-адресов</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">🎈</div>
      <div class="brand-text">
        <h1>Шарик</h1>
        <span class="subtitle">Продвинутый сканер IP-адресов</span>
      </div>
    </div>
    <button id="aboutBtn" class="link-btn" title="О программе">О программе</button>
  </header>

  <section class="controls">
    <div class="row">
      <label class="field grow">
        <span>Диапазон IPv4</span>
        <input id="range" type="text" placeholder="напр. 192.168.1.0/24 или 192.168.1.1-254" />
      </label>
      <button id="localBtn" class="ghost" title="Подставить локальную сеть">Моя сеть</button>
    </div>

    <div class="row options">
      <label class="field small">
        <span>Потоки</span>
        <input id="concurrency" type="number" min="1" max="512" value="128" />
      </label>
      <label class="field small">
        <span>Таймаут ping (мс)</span>
        <input id="pingTimeout" type="number" min="200" max="10000" step="100" value="1000" />
      </label>
      <label class="checkbox">
        <input id="resolveNames" type="checkbox" checked />
        <span>Имена хостов (DNS)</span>
      </label>
      <label class="checkbox">
        <input id="scanPorts" type="checkbox" />
        <span>Сканировать порты</span>
      </label>
      <label class="field small" id="portTimeoutWrap" style="display:none">
        <span>Таймаут порта (мс)</span>
        <input id="portTimeout" type="number" min="100" max="5000" step="50" value="600" />
      </label>
    </div>

    <div class="row" id="portsRow" style="display:none">
      <label class="field grow">
        <span>Порты (через запятую, пусто = типовые)</span>
        <input id="ports" type="text" placeholder="напр. 22,80,443,3389" />
      </label>
    </div>

    <div class="row actions">
      <button id="scanBtn" class="primary">▶ Сканировать</button>
      <button id="cancelBtn" class="danger" disabled>■ Остановить</button>
      <button id="exportBtn" class="ghost" disabled>⤓ Экспорт CSV</button>
      <button id="clearBtn" class="ghost">Очистить</button>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
      <div id="progressText" class="progress-text">Готов к сканированию</div>
    </div>
  </section>

  <section class="results">
    <div class="results-head">
      <input id="filter" type="text" class="filter" placeholder="Фильтр по IP / имени / MAC / производителю…" />
      <span id="countBadge" class="badge">0 устройств</span>
    </div>
    <div class="table-wrap">
      <table id="resultsTable">
        <thead>
          <tr>
            <th data-sort="ip">IP-адрес</th>
            <th data-sort="hostname">Имя хоста</th>
            <th data-sort="mac">MAC-адрес</th>
            <th data-sort="vendor">Производитель</th>
            <th data-sort="time">Отклик</th>
            <th data-sort="ports">Открытые порты</th>
          </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
      </table>
      <div id="emptyState" class="empty">Введите диапазон и нажмите «Сканировать».</div>
    </div>
  </section>

  <footer class="footer">
    <span id="footerInfo">Шарик</span>
    <span class="footer-author">Автор: Горшков Сергей Владимирович</span>
  </footer>

  <script src="renderer.js"></script>
</body>
</html>
